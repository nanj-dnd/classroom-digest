<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Classroom Digest</title>
<style>
:root{
  --bg:#ffffff; --panel:#f7f7f5; --ink:#1f1f1d; --muted:#6b6a66; --faint:#6f6e6a;
  --line:#e8e7e3; --hover:#f2f1ee; --accent:#2b6fd6; --accent-ink:#ffffff; --accent-soft:#e8f0fc;
  --red:#c2410c; --red-dot:#dc4a26; --amber:#a16207; --amber-dot:#e0a020; --blue-dot:#3b82d6; --gray-dot:#b9b7b1;
  --amber-soft:#fbf4e2; --ok:#2f7d4f; --shadow:0 6px 24px -8px rgba(20,20,15,.22), 0 2px 6px -2px rgba(20,20,15,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#191918; --panel:#202020; --ink:#e7e6e3; --muted:#a3a19c; --faint:#94928d;
  --line:#2e2e2c; --hover:#262625; --accent:#5b9bf0; --accent-ink:#0d1420; --accent-soft:#1c2a3d;
  --red:#f08a6b; --red-dot:#f0714e; --amber:#e6b450; --amber-dot:#e6b450; --blue-dot:#6aa8f0; --gray-dot:#5d5b57;
  --amber-soft:#2a2414; --ok:#62c08a; --shadow:0 8px 28px -8px rgba(0,0,0,.6), 0 2px 6px -2px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#191918; --panel:#202020; --ink:#e7e6e3; --muted:#a3a19c; --faint:#94928d;
  --line:#2e2e2c; --hover:#262625; --accent:#5b9bf0; --accent-ink:#0d1420; --accent-soft:#1c2a3d;
  --red:#f08a6b; --red-dot:#f0714e; --amber:#e6b450; --amber-dot:#e6b450; --blue-dot:#6aa8f0; --gray-dot:#5d5b57;
  --amber-soft:#2a2414; --ok:#62c08a; --shadow:0 8px 28px -8px rgba(0,0,0,.6), 0 2px 6px -2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft);color:var(--ink)}
a{color:inherit;text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg{flex:none}

/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:20px;height:56px}
.brand{font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap;text-decoration:none}
nav{display:flex;gap:2px;flex:1;min-width:0}
nav a{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
nav a:hover{background:var(--hover);color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);background:var(--hover)}
.count{font-size:11.5px;font-weight:600;line-height:18px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red-dot);color:#fff;text-align:center;font-variant-numeric:tabular-nums}
.who{font-size:13px;color:var(--faint);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.who:hover{color:var(--ink)}
@media(max-width:720px){
  .top-in{flex-wrap:wrap;height:auto;padding:10px 16px 0;gap:4px 12px}
  .who{margin-left:auto}
  nav{order:3;flex-basis:100%;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 12px 8px}
  nav::-webkit-scrollbar{display:none}
}

/* page */
main{max-width:880px;margin:0 auto;padding:40px 24px 120px}
@media(max-width:720px){main{padding:24px 16px 120px}}
h1{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 24px;max-width:62ch}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:32px 0 6px;display:flex;align-items:center;gap:8px}
h2 .n{font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
h3{font-size:16px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.section{padding:28px 0;border-top:1px solid var(--line)}
.section:first-of-type{border-top:0;padding-top:4px}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 14px;max-width:62ch}

/* filters */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);transition:background .15s,border-color .15s,color .15s}
.chip:hover{background:var(--hover);color:var(--ink)}
.classbar{margin:0 0 4px}
.classbar + table,.classbar + .empty{margin-top:20px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* task rows */
.list{margin:0;padding:0;list-style:none}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;margin:0 -8px;border-radius:8px;transition:background .15s,opacity .2s,transform .2s}
.row:hover{background:var(--hover)}
.row + .row{box-shadow:0 -1px 0 var(--line)}
.row:hover + .row,.row:hover{box-shadow:none}
.dot{width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--gray-dot);flex:none}
.dot.overdue,.dot.today{background:var(--red-dot)} .dot.soon{background:var(--amber-dot)} .dot.week{background:var(--blue-dot)}
.dot.note{background:transparent;box-shadow:inset 0 0 0 1.5px var(--amber-dot)}
.body{flex:1;min-width:0}
.title{font-weight:550;text-decoration:none;word-break:break-word}
.title:hover{text-decoration:underline}
.meta{font-size:13px;color:var(--muted);margin-top:1px}
.meta .late{color:var(--red);font-weight:550}
.quote{font-size:13px;color:var(--muted);margin-top:4px;max-width:70ch}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--faint);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;opacity:0;transition:opacity .15s,background .15s,color .15s}
.row:hover .icon-btn,.icon-btn:focus-visible{opacity:1}
.icon-btn:hover{background:var(--line);color:var(--ink)}
@media(hover:none){.icon-btn{opacity:1}}
.empty{color:var(--muted);padding:28px 0;font-size:14.5px}

/* disclosure */
details.more{margin-top:28px;border-top:1px solid var(--line)}
details.more>summary{cursor:pointer;list-style:none;padding:14px 0 6px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary svg{transition:transform .15s}
details.more[open]>summary svg{transform:rotate(90deg)}
details.more>summary:hover{color:var(--ink)}

/* updates */
.post{padding:14px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0}
.post .meta{margin:0 0 4px}
.post p{margin:0;white-space:pre-wrap;word-break:break-word;max-width:72ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.post.open p{display:block}
.links{display:flex;gap:14px;margin-top:6px;font-size:13px}
.links a,.links button{color:var(--accent);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:13px}
.links a:hover,.links button:hover{text-decoration:underline}

/* grades */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;font-size:12.5px;color:var(--faint);padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:0}
td .meta{margin:0}

/* claude */
.field{display:flex;gap:8px;align-items:stretch;margin:6px 0 0;max-width:560px}
.field code{flex:1;min-width:0;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.steps{margin:10px 0 0;padding-left:20px;max-width:62ch}
.steps li{margin:0 0 6px;color:var(--muted)}
.steps li b{color:var(--ink);font-weight:550}
.ask{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px;max-width:560px}
.ask li{background:var(--panel);border-radius:8px;padding:9px 12px;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.danger{color:var(--red)}
.btn.danger.armed{background:var(--red-dot);color:#fff;border-color:var(--red-dot)}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* settings controls */
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0}
.switch-row + .switch-row{border-top:1px solid var(--line)}
.switch-row .lbl{min-width:0}
.switch-row .lbl div:last-child{font-size:13px;color:var(--muted)}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:12px;background:var(--line);transition:background .18s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(16px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:140px 1fr;gap:14px 20px;align-items:center;margin-top:16px;max-width:620px}
.grid > label{font-size:13.5px;color:var(--muted)}
@media(max-width:560px){.grid{grid-template-columns:1fr;gap:6px}.grid > label{margin-top:10px}}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days .chip{min-width:44px;text-align:center}
select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px;max-width:100%}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
@media(max-width:560px){.checks{grid-template-columns:1fr}}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;padding:4px 0;cursor:pointer}
.check input{accent-color:var(--accent);margin:3px 0 0;width:16px;height:16px;flex:none}
.muted-block{opacity:.5;pointer-events:none;transition:opacity .2s}
.status{font-size:13px;color:var(--faint);min-height:20px}
.status.ok{color:var(--ok)} .status.err{color:var(--red)}
.course-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 0;border-top:1px solid var(--line)}
.course-row:first-child{border-top:0}
.course-row .sec{font-size:12.5px;color:var(--faint)}

/* skeleton */
.sk{height:14px;border-radius:5px;background:linear-gradient(90deg,var(--hover),var(--line),var(--hover));background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:var(--shadow);transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px);z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{background:none;border:0;color:inherit;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:5px;text-decoration:underline;text-underline-offset:3px}

/* setup */
body.setup nav,body.setup .who{display:none}
.skip{margin-left:auto;font-size:13px;color:var(--faint);background:none;border:0;cursor:pointer;padding:6px 4px}
.skip:hover{color:var(--ink)}
body:not(.setup) .skip{display:none}
.ob{max-width:600px;margin:0 auto}
.progress{display:flex;gap:6px;align-items:center;margin:0 0 28px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .25s}
.progress i.on{background:var(--accent)}
.progress span{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-left:6px}
.opts{display:grid;gap:8px;margin:0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{background:var(--hover)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent);width:17px;height:17px;margin:2px 0 0;flex:none}
.opt .t{font-weight:550}
.opt .s{font-size:13px;color:var(--muted);margin-top:1px}
.opt .tag{display:inline-block;font-size:11.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:400;vertical-align:1px}
.egs{display:grid;gap:6px}
.eg{padding:11px 14px;border-radius:10px;background:var(--panel)}
.eg .t{font-weight:550}
.eg .s{font-size:13px;color:var(--muted);margin-top:1px}
.ob-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.ob-actions .status{flex:1;text-align:right}
footer{max-width:880px;margin:0 auto;padding:0 24px 40px;font-size:12.5px;color:var(--faint)}
footer a{color:inherit}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#todo">Classroom Digest</a>
  <nav aria-label="Sections">
    <a href="#todo" data-tab="todo">To do <span class="count" id="todo-count" hidden></span></a>
    <a href="#updates" data-tab="updates">Updates</a>
    <a href="#grades" data-tab="grades">Grades</a>
    <a href="#claude" data-tab="claude">Claude</a>
    <a href="#settings" data-tab="settings">Settings</a>
  </nav>
  <a class="who" id="who" href="#settings"></a>
  <button class="skip" type="button" id="skip-setup">Skip setup</button>
</div></header>
<main id="main" tabindex="-1"></main>
<footer id="foot"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="toast-undo" type="button">Undo</button></div>

<script>
const MCP_URL = location.origin + '/mcp';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I = {
  hide:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a13.2 13.2 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 8 10 8a9.7 9.7 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m2 2 20 20"/></svg>',
  show:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  copy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  ext:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  chev:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  mail:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
};

let DATA = null, ERR = null;
// One class filter for every tab, remembered on this device only.
let courseFilter = (() => { try { return localStorage.getItem('cd.class') || 'all'; } catch { return 'all'; } })();
function setClass(id) { courseFilter = id; try { localStorage.setItem('cd.class', id); } catch {} }
const inClass = x => courseFilter === 'all' || x.courseId === courseFilter;
const className = () => { const c = (DATA.courses || []).find(c => c.id === courseFilter); return c ? short(c.name) : ''; };
function classBar() {
  const visible = (DATA.courses || []).filter(c => !c.hidden);
  if (visible.length < 2) return '';
  return `<div class="chips classbar" role="group" aria-label="Filter by class"><button class="chip" type="button" data-course="all" aria-pressed="${courseFilter === 'all'}">All classes</button>` +
    visible.map(c => `<button class="chip" type="button" data-course="${esc(c.id)}" aria-pressed="${courseFilter === c.id}">${esc(short(c.name))}</button>`).join('') + '</div>';
}
const ORDER = ['overdue','today','soon','week','later','undated'];
const LABEL = {overdue:'Overdue',today:'Next 24 hours',soon:'Next 3 days',week:'This week',later:'Later',undated:'No due date'};
const DAYS = [['Mon',1],['Tue',2],['Wed',3],['Thu',4],['Fri',5],['Sat',6],['Sun',0]];
const INCLUDE = [
  ['overdue','Overdue work'],['today','Due in the next 24 hours'],['soon','Due in the next 3 days'],['week','Due this week'],
  ['later','Due later (within 2 weeks)'],['undated','Work with no due date'],['mentioned','Dates mentioned in announcements'],
  ['announcements','New announcements'],['grades','New grades'],
];
const PRIORITIES = [
  ['deadlines', 'Never miss a deadline', 'Overdue work and what is due in the next few days, first.'],
  ['mentioned', 'Catch deadlines that aren\u2019t on Classroom', 'Dates professors only wrote in announcements.'],
  ['announcements', 'Keep up with announcements', 'Everything your professors posted, in one place.'],
  ['grades', 'Know when grades come back', 'New grades as soon as they are returned.'],
  ['plan', 'Plan my week', 'Everything due in the next two weeks, including work with no date.'],
  ['claude', 'Ask Claude about my classes', 'Connect your own Claude to your Classroom.'],
];
// What each priority switches on in the email.
function includeFor(pr) {
  const has = k => pr.has(k), any = pr.size > 0;
  if (!any) return {overdue:true,today:true,soon:true,week:true,later:false,undated:false,mentioned:true,announcements:true,grades:true};
  const work = has('deadlines') || has('plan');
  return {overdue:work, today:work, soon:work, week:work, later:has('plan'), undated:has('plan'),
    mentioned:has('mentioned') || has('deadlines'), announcements:has('announcements'), grades:has('grades')};
}
let OB = null; // setup state while the flow is open
function startSetup() {
  const me = DATA.me || {}, r = me.reminders || {};
  const pr = new Set(me.priorities || []);
  OB = {
    step: 1,
    shown: new Set((DATA.courses || []).filter(c => !c.hidden).map(c => c.id)),
    priorities: pr,
    touchedInclude: false,
    reminders: {on: me.onboarded ? !!r.on : true, days: r.days && r.days.length ? [...r.days] : [0,1,2,3,4,5,6], hour: Number.isInteger(r.hour) ? r.hour : 21,
      include: me.onboarded && r.include ? {...r.include} : includeFor(pr), skipEmpty: r.skipEmpty !== false},
    tz: me.hasSettings ? me.tz : detectedTz,
  };
}
const STEPS = 4;

      <label for="ob-hour">Time</label><div><select id="ob-hour">${Array.from({length:24}, (_, h) => `<option value="${h}" ${h === r.hour ? 'selected' : ''}>${hourLabel(h)}</option>`).join('')}</select>

async function finishSetup(btn) {
  const st = document.getElementById('ob-status');
  if (OB.reminders.on && !OB.reminders.days.length) { st.className = 'status err'; st.textContent = 'Pick at least one day.'; return; }
  btn.disabled = true; st.className = 'status'; st.textContent = 'Saving…';
  try {
    const hiddenCourses = (DATA.courses || []).filter(c => !OB.shown.has(c.id)).map(c => c.id);
    await post('/api/prefs', {hiddenCourses, priorities: [...OB.priorities], reminders: OB.reminders, tz: OB.tz, onboarded: true});
    OB = null; DATA = null; document.body.classList.remove('setup');
    location.hash = '#todo';
    await load();
    if (DATA && DATA.me.reminders.on) toast(`Set up. First email ${nextSend(DATA.me.reminders, DATA.me.tz)}.`);
  } catch (e) { btn.disabled = false; st.className = 'status err'; st.textContent = e.message; }
}

const detectedTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Kolkata'; } catch { return 'Asia/Kolkata'; } })();

const d = s => s ? new Date(s) : null;
const fmtDay = x => x.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
const fmtTime = x => x.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
const mid = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
function rel(due, now = new Date()) {
  if (!due) return 'No due date';
  const h = (due - now) / 36e5;
  if (h < 0) { const n = Math.floor(-h / 24); return n >= 1 ? `${n} day${n > 1 ? 's' : ''} overdue` : `${Math.max(1, Math.floor(-h))}h overdue`; }
  if (h <= 24) return `Due in ${Math.max(1, Math.round(h))}h · ${fmtTime(due)}`;
  const days = Math.round((mid(due) - mid(now)) / 864e5);
  return `${days === 1 ? 'Tomorrow' : fmtDay(due)} · ${fmtTime(due)}`;
}
const hourLabel = h => h === 0 ? 'midnight' : h === 12 ? 'noon' : `${h % 12} ${h < 12 ? 'am' : 'pm'}`;

/* ---------- network ---------- */
async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {})});
  if (r.status === 401) { location.href = '/'; throw new Error('signed-out'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
async function load() {
  ERR = null;
  try {
    const r = await fetch('/api/data?tz=' + new Date().getTimezoneOffset());
    if (r.status === 401) { location.href = '/'; return; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong. Reload to try again.');
    DATA = j;
    if (courseFilter !== 'all' && !(DATA.courses || []).some(c => c.id === courseFilter && !c.hidden)) setClass('all');
  } catch (e) { ERR = e.message; }
  render();
}

/* ---------- views ---------- */
const tab = () => (location.hash.slice(1) || 'todo').split('?')[0];

function taskRow(i, bucket) {
  const late = i.late ? ' · <span class="late">late</span>' : '';
  return `<li class="row" data-id="${esc(i.id)}">
    <span class="dot ${bucket}"></span>
    <div class="body">
      <a class="title" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      <div class="meta">${esc(i.course)} · ${esc(rel(d(i.due)))}${i.points ? ' · ' + esc(i.points) + ' pts' : ''}${i.started ? ' · draft started' : ''}${late}</div>
    </div>
    <button class="icon-btn" type="button" data-hide="${esc(i.id)}" aria-label="Hide ${esc(i.title)}">${I.hide}<span>Hide</span></button>
  </li>`;
}

function noteRow(m) {
  const n = Math.round((mid(d(m.date)) - mid(new Date())) / 864e5);
  const when = n === 0 ? 'today' : n === 1 ? 'tomorrow' : n < 0 ? `${-n} day${n < -1 ? 's' : ''} ago` : `in ${n} days`;
  return `<li class="row" data-id="${esc(m.id)}">
    <span class="dot note"></span>
    <div class="body">
      <a class="title" href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.course)} · ${esc(fmtDay(d(m.date)))}</a>
      <div class="meta">Mentioned in an announcement, ${esc(when)}. Not a Classroom assignment.</div>
      <div class="quote">${esc(m.quote)}</div>
    </div>
    <button class="icon-btn" type="button" data-hide="${esc(m.id)}" aria-label="Hide this date">${I.hide}<span>Hide</span></button>
  </li>`;
}

function viewTodo() {
  const P = DATA, o = [];
  const matches = inClass;
  const groups = ORDER.map(b => [b, (P.buckets[b] || []).filter(matches)]).filter(([, l]) => l.length);
  const notes = (P.mentioned || []).filter(matches);
  const n = b => (P.buckets[b] || []).filter(matches).length;
  const parts = [];
  if (n('overdue')) parts.push(`${n('overdue')} overdue`);
  if (n('today')) parts.push(`${n('today')} due in 24 hours`);
  if (n('soon') + n('week')) parts.push(`${n('soon') + n('week')} more this week`);
  if (n('undated')) parts.push(`${n('undated')} with no due date`);

  o.push(`<h1>To do</h1><p class="lede">${parts.length ? esc(parts.join(' · ')) : `Nothing open in the next two weeks${courseFilter === 'all' ? '' : ' for ' + esc(className())}.`}</p>`);
  o.push(classBar());
  if (!groups.length && !notes.length) {
    o.push(`<p class="empty">Nothing to do here. Hidden tasks are below; hidden courses are in <a href="#settings">Settings</a>.</p>`);
  }
  for (const [b, list] of groups) {
    o.push(`<h2>${LABEL[b]} <span class="n">${list.length}</span></h2><ul class="list">${list.map(i => taskRow(i, b)).join('')}</ul>`);
  }
  if (notes.length) {
    o.push(`<h2>Dates in announcements <span class="n">${notes.length}</span></h2><p class="hint">Found in what professors wrote, not set up as assignments. Worth a check.</p><ul class="list">${notes.map(noteRow).join('')}</ul>`);
  }
  if ((P.hidden || []).length) {
    o.push(`<details class="more"><summary>${I.chev} Hidden tasks (${P.hidden.length})</summary><ul class="list">` +
      P.hidden.map(h => `<li class="row"><span class="dot"></span><div class="body"><div class="title" style="font-weight:500">${esc(h.title)}</div><div class="meta">${esc(h.course)}</div></div>
        <button class="icon-btn" type="button" style="opacity:1" data-unhide="${esc(h.id)}">${I.show}<span>Show again</span></button></li>`).join('') + '</ul></details>');
  }
  return o.join('');
}

function render() {
  const t = tab();
  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === t ? 'page' : 'false'));
  const main = document.getElementById('main');
  const inSetup = !!(DATA && !ERR && (OB || !(DATA.me && DATA.me.onboarded)));
  document.body.classList.toggle('setup', inSetup);
  if (inSetup) { if (!OB) startSetup(); main.innerHTML = viewSetup(); }
  else if (t === 'claude') { main.innerHTML = viewClaude(); }
  else if (ERR) { main.innerHTML = `<h1>Couldn't load</h1><p class="lede">${esc(ERR)}</p><div class="actions"><button class="btn primary" type="button" onclick="location.reload()">Try again</button><button class="btn" type="button" data-ui="signout">Sign out</button></div>`; }
  else if (!DATA) { main.innerHTML = skeleton(); }
  else main.innerHTML = ({todo:viewTodo, updates:viewUpdates, grades:viewGrades, settings:viewSettings}[t] || viewTodo)();
  if (DATA) {
    const urgent = [...(DATA.buckets.overdue || []), ...(DATA.buckets.today || [])].filter(inClass).length;
    const c = document.getElementById('todo-count'); c.hidden = !urgent; c.textContent = urgent;
    document.getElementById('who').textContent = (DATA.me && DATA.me.email) || '';
    document.getElementById('foot').innerHTML = `Loaded live from Google Classroom at ${esc(fmtTime(d(DATA.generatedAt)))}. <a href="/privacy">Privacy</a> · <a href="https://github.com/nanj-dnd/classroom-digest" target="_blank" rel="noopener">Source</a>`;
  }
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

/* ---------- toast ---------- */
let toastTimer, toastUndo;
function toast(text, undo) {
  const el = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  document.getElementById('toast-undo').hidden = !undo;
  toastUndo = undo; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}
document.getElementById('toast-undo').addEventListener('click', () => { document.getElementById('toast').classList.remove('show'); toastUndo && toastUndo(); });

/* ---------- hide / unhide ---------- */
function findTask(id) {
  for (const b of ORDER) { const k = (DATA.buckets[b] || []).findIndex(i => i.id === id); if (k >= 0) return {b, k, item: DATA.buckets[b][k]}; }
  const k = DATA.mentioned.findIndex(m => m.id === id);
  return k >= 0 ? {b: 'mentioned', k, item: DATA.mentioned[k]} : null;
}
async function hide(id) {
  const f = findTask(id); if (!f) return;
  const list = f.b === 'mentioned' ? DATA.mentioned : DATA.buckets[f.b];
  list.splice(f.k, 1);
  const title = f.b === 'mentioned' ? `${f.item.course} · ${fmtDay(d(f.item.date))}` : f.item.title;
  DATA.hidden = [{id, title, course: f.item.course, link: f.item.link}, ...(DATA.hidden || [])];
  render();
  toast(`Hidden “${title}”`, () => unhide(id, f));
  try { const j = await post('/api/prefs', {hide: {id, title, course: f.item.course, link: f.item.link}}); DATA.hidden = j.hidden; }
  catch (e) { list.splice(f.k, 0, f.item); DATA.hidden = DATA.hidden.filter(h => h.id !== id); render(); toast(e.message); }
}
async function unhide(id, restore) {
  DATA.hidden = (DATA.hidden || []).filter(h => h.id !== id);
  if (restore) { (restore.b === 'mentioned' ? DATA.mentioned : DATA.buckets[restore.b] ||= []).splice(restore.k, 0, restore.item); render(); }
  try { const j = await post('/api/prefs', {unhide: id}); DATA.hidden = j.hidden; if (!restore) await load(); else render(); }
  catch (e) { toast(e.message); }
}

/* ---------- settings ---------- */
function readReminders() {
  return {
    on: document.getElementById('r-on').checked,
    days: [...document.querySelectorAll('[data-day]')].filter(b => b.getAttribute('aria-pressed') === 'true').map(b => +b.dataset.day),
    hour: +document.getElementById('r-hour').value,
    include: Object.fromEntries([...document.querySelectorAll('[data-inc]')].map(i => [i.dataset.inc, i.checked])),
    skipEmpty: document.getElementById('r-skip').checked,
  };
}
let saveTimer;
function saveReminders() {
  const st = document.getElementById('r-status'); st.className = 'status'; st.textContent = 'Saving…';
  document.getElementById('r-body').className = document.getElementById('r-on').checked ? '' : 'muted-block';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const reminders = readReminders();
    if (reminders.on && !reminders.days.length) { st.className = 'status err'; st.textContent = 'Pick at least one day.'; return; }
    try {
      const j = await post('/api/prefs', {reminders, tz: document.getElementById('r-tz').value});
      DATA.me = {...DATA.me, ...j.me, hasSettings: true};
      st.className = 'status ok';
      st.textContent = reminders.on ? `Saved. Next one ${nextSend(reminders, j.me.tz)}.` : 'Saved. Reminders are off.';
    } catch (e) { st.className = 'status err'; st.textContent = e.message; }
  }, 350);
}
function nextSend(r, tz) {
  const now = new Date();
  for (let k = 0; k < 8; k++) {
    const day = new Date(now.getTime() + k * 864e5);
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone: tz, weekday: 'short', hour: 'numeric', hourCycle: 'h23'}).formatToParts(day).map(p => [p.type, p.value]));
    const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday);
    if (!r.days.includes(wd)) continue;
    if (k === 0 && +parts.hour >= r.hour) continue;
    const label = k === 0 ? 'today' : k === 1 ? 'tomorrow' : day.toLocaleDateString(undefined, {weekday: 'long', timeZone: tz});
    return `${label} around ${hourLabel(r.hour)}`;
  }
  return 'soon';
}

document.addEventListener('change', async e => {
  const t = e.target;
  if (OB) {
    if (t.dataset.obCourse) { t.checked ? OB.shown.add(t.dataset.obCourse) : OB.shown.delete(t.dataset.obCourse); return; }
    if (t.dataset.obPriority) {
      t.checked ? OB.priorities.add(t.dataset.obPriority) : OB.priorities.delete(t.dataset.obPriority);
      if (!OB.touchedInclude) OB.reminders.include = includeFor(OB.priorities);
      return;
    }
    if (t.id === 'ob-on') { OB.reminders.on = t.checked; return render(); }
    if (t.id === 'ob-hour') { OB.reminders.hour = +t.value; return render(); }
    if (t.id === 'ob-tz') { OB.tz = t.value; return; }
    if (t.dataset.obInc) { OB.reminders.include[t.dataset.obInc] = t.checked; OB.touchedInclude = true; return; }
  }
  if (t.id === 'r-on' || t.id === 'r-hour' || t.id === 'r-tz' || t.id === 'r-skip' || t.dataset.inc) return saveReminders();
  if (t.dataset.courseToggle) {
    const hiddenCourses = [...document.querySelectorAll('[data-course-toggle]')].filter(i => !i.checked).map(i => i.dataset.courseToggle);
    const st = document.getElementById('c-status'); st.className = 'status'; st.textContent = 'Saving…';
    try { await post('/api/prefs', {hiddenCourses}); st.className = 'status ok'; st.textContent = 'Saved.'; load(); }
    catch (err) { st.className = 'status err'; st.textContent = err.message; }
  }
});

let deleteArmed = false;
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ob === 'next') {
    if (OB.step === 1 && (DATA.courses || []).length && !OB.shown.size) { const st = document.getElementById('ob-status'); st.textContent = 'Pick at least one class.'; return; }
    OB.step++; render(); window.scrollTo(0, 0); return;
  }
  if (b.dataset.ob === 'back') { OB.step--; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.ob === 'finish') return finishSetup(b);
  if (b.dataset.obDay !== undefined) {
    const v = +b.dataset.obDay, days = OB.reminders.days;
    OB.reminders.days = days.includes(v) ? days.filter(x => x !== v) : [...days, v];
    b.setAttribute('aria-pressed', OB.reminders.days.includes(v)); return;
  }
  if (b.id === 'skip-setup') {
    b.disabled = true;
    try { await post('/api/prefs', {onboarded: true}); DATA.me.onboarded = true; } catch (err) { toast(err.message); }
    OB = null; b.disabled = false; return render();
  }
  if (b.dataset.ui === 'redo-setup') { startSetup(); window.scrollTo(0, 0); return render(); }
  if (b.dataset.hide) return hide(b.dataset.hide);
  if (b.dataset.unhide) { b.disabled = true; return unhide(b.dataset.unhide); }
  if (b.dataset.course) { setClass(b.dataset.course); return render(); }
  if (b.dataset.day !== undefined) { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); return saveReminders(); }
  if (b.dataset.expand) { document.getElementById(b.dataset.expand).classList.add('open'); return b.remove(); }
  if (b.dataset.copy) {
    try { await navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent); b.innerHTML = I.check + '<span>Copied</span>'; setTimeout(() => b.innerHTML = I.copy + '<span>Copy</span>', 1800); }
    catch { toast('Copy failed. Select the text and copy it.'); }
    return;
  }
  if (b.id === 'r-test') {
    const st = document.getElementById('r-status'); b.disabled = true; st.className = 'status'; st.textContent = 'Sending…';
    try { const j = await post('/api/test-email'); st.className = 'status ok'; st.textContent = `Sent to ${j.to}.`; }
    catch (err) { st.className = 'status err'; st.textContent = err.message; }
    b.disabled = false; return;
  }
  if (b.dataset.ui === 'signout') { b.disabled = true; await post('/api/signout').catch(() => {}); location.href = '/'; return; }
  if (b.id === 'delete') {
    if (!deleteArmed) { deleteArmed = true; b.classList.add('armed'); b.textContent = 'Click again to delete everything'; setTimeout(() => { deleteArmed = false; if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'Delete my data'; } }, 4000); return; }
    b.disabled = true; b.textContent = 'Deleting…';
    try { await post('/api/delete-account'); location.href = '/'; } catch (err) { toast(err.message); b.disabled = false; b.textContent = 'Delete my data'; }
  }
});

render();
load();
</script>
</body>
