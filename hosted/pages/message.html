<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · Classroom Digest</title>
<meta name="description" content="See everything due across your Google Classroom courses on one page.">
<style>
:root{--bg:#fff;--ink:#37352f;--muted:#787774;--faint:#9b9a97;--line:#e9e9e7;--hover:#f1f1ef;--tint:#f7f6f3;--amberbg:#fbf3db}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){--bg:#191919;--ink:#d4d4d4;--muted:#9b9b9b;--faint:#6f6f6f;--line:#2f2f2f;--hover:#252525;--tint:#202020;--amberbg:#2c2413}}
:root[data-theme="dark"]{--bg:#191919;--ink:#d4d4d4;--muted:#9b9b9b;--faint:#6f6f6f;--line:#2f2f2f;--hover:#252525;--tint:#202020;--amberbg:#2c2413}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:640px;margin:0 auto;padding:72px 32px 96px}
@media(max-width:640px){.page{padding:40px 16px 72px}}
h1{font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
@media(max-width:640px){h1{font-size:30px}}
h2{font-size:16px;font-weight:600;margin:34px 0 6px}
p{margin:0 0 12px;color:var(--muted);font-size:15px}
a{color:inherit}
.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;font-size:15px;padding:10px 18px;border-radius:6px;margin:12px 0 4px}
.btn:hover{opacity:.88}
ul{padding-left:18px;margin:8px 0 0}
li{font-size:14.5px;color:var(--muted);margin-bottom:6px}
.note{background:var(--amberbg);border-radius:4px;padding:12px 14px;font-size:13.5px;margin:26px 0 0;color:var(--ink)}
.note p{font-size:13.5px;color:var(--ink);margin:0}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:12px;font-size:12px;color:var(--faint)}
footer a{color:inherit}
</style>
</head>
<body><div class="page">
<h1>{{title}}</h1>
<p>{{body}}</p>
<a class="btn" href="/">Back</a>
</div></body>
</html>
